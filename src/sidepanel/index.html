<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCR Buddy</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="brand"><span class="logo">OB</span> OCR Buddy</div>
      <span id="backend" class="badge" hidden></span>
    </header>

    <!-- IDLE -->
    <section id="state-idle" class="state">
      <button id="select-btn" class="btn-primary big">
        <span class="ico">⤢</span> Select region
      </button>
      <p class="hint">
        Then drag over the text on the page.<br />
        Shortcut: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>O</kbd>
      </p>
    </section>

    <!-- BUSY -->
    <section id="state-busy" class="state" hidden>
      <div id="spinner" class="spinner"></div>
      <p id="busy-label" class="hint"></p>
    </section>

    <!-- RESULT -->
    <section id="state-result" class="state" hidden>
      <figure>
        <figcaption>Captured region</figcaption>
        <img id="crop" alt="captured region" />
      </figure>

      <div class="text-head">
        <h2>Extracted text</h2>
        <div class="seg" role="tablist" aria-label="View mode">
          <button id="seg-prose" class="seg-btn is-active" type="button">Prose</button>
          <button id="seg-code" class="seg-btn" type="button">Code</button>
        </div>
      </div>

      <!-- Source crop shown above the text: the cheapest anti-hallucination check. -->
      <div id="text" class="text" contenteditable="true" spellcheck="false"></div>
      <p id="empty-note" class="empty-note" hidden>
        No confident text found in this region. Nothing was invented.
      </p>

      <div class="actions">
        <button id="copy" class="btn-secondary" type="button">Copy</button>
        <button id="new-capture" class="btn-primary" type="button">New capture</button>
      </div>
    </section>

    <!-- ERROR -->
    <section id="state-error" class="state" hidden>
      <p id="error-msg" class="error"></p>
      <button id="retry-btn" class="btn-primary" type="button">Try again</button>
    </section>

    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
